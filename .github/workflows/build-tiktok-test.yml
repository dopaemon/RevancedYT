# Same build as the release workflow, but published as a pre-release and
# announced in the CI channel.

name: Build TikTok (Test)

permissions:
  contents: write

concurrency:
  group: build-tiktok-test-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('tiktok.sh', 'revanced-common.sh', '.github/workflows/build-tiktok-test.yml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install Pillow
        run: pip install --quiet pillow
      - name: Start building
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PATCHES_TOKEN: ${{ secrets.PATCHES_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FAST_BUILD: "true"
        run: |
          ./tiktok.sh test
